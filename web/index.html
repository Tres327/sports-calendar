<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Sports Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1>Family Sports Calendar</h1>
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="upcoming">Upcoming</button>
        <button role="tab" data-view="month">Month</button>
        <button role="tab" data-view="results">Results</button>
        <button role="tab" data-view="subscribe">Subscribe</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="team-filter" class="team-filter" aria-label="Teams"></section>
    <section id="view"></section>
  </main>

  <footer class="wrap foot">
    <span id="updated"></span>
    <span>Schedules &amp; scores from ESPN</span>
  </footer>

  <dialog id="game-dialog">
    <div id="game-detail"></div>
    <form method="dialog"><button class="btn">Close</button></form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
